[project]
name = "relay_superagent"
version = "0.1.0"
description = "Relay Watcher v1 — the competitive loop. See spec/relay_superagent-watcher-v1-spec.md."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay_superagent"]
